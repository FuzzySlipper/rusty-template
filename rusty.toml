[product]
id = "rusty.product.template"

[runtime_composition]
entrypoints = ["rules/main.ts"]

[lifecycle]
mode = "realtime"

[lifecycle.realtime]
fixed_step_hz = 60
max_catch_up_steps = 4

[kernel]
entry = "kernel/entry.rs"

[ui]
entry = "ui/main.ts"
projection_stream = "counter"
projection_contract = "counter.v1"

[content]
root = "content"

[outputs]
compiled_composition = "generated/compiled-composition.json"
admitted_runtime_content = "generated/runtime-content"
product_assembly = "generated/product-assembly"
product_bundle = "generated/product-bundle"

[[wrappers]]
id = "desktop"
kind = "tauri"
version = "0.1.0"
application_id = "org.rusty.product.template"
title = "Rusty Template"
window_width = 1280
window_height = 720
resizable = true
permissions = ["window", "storage"]
storage_namespace = "rusty.product.template"
release_channel = "development"
singleton = true
